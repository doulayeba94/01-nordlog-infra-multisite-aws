<svg width="680" height="380" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Architecture réseau existante de NORDLOG</title>
<desc>Siège à Lille connecté à 4 entrepôts via VPN IPSec sur liaisons ADSL non redondées.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#595E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="380" fill="#FFFFFF"/>

<path d="M290 100 L120 100 L120 220" fill="none" stroke="#595E5A" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<path d="M290 100 L250 100 L250 220" fill="none" stroke="#595E5A" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<path d="M390 100 L430 100 L430 220" fill="none" stroke="#595E5A" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<path d="M390 100 L560 100 L560 220" fill="none" stroke="#595E5A" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

<text x="120" y="170" font-family="sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle">VPN/ADSL 20M</text>
<text x="250" y="190" font-family="sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle">VPN/ADSL 20M</text>
<text x="430" y="190" font-family="sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle">VPN/ADSL 10M</text>
<text x="560" y="170" font-family="sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle">VPN/ADSL 10M</text>

<rect x="240" y="44" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="66" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle">Siège (Lille)</text>
<text x="340" y="86" font-family="sans-serif" font-size="11" fill="#444441" text-anchor="middle">Serveur WMS unique, Fibre 50M non redondée</text>

<rect x="30" y="220" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="120" y="242" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C" text-anchor="middle">Entrepôt Lyon</text>
<text x="120" y="262" font-family="sans-serif" font-size="11" fill="#085041" text-anchor="middle">Panne WMS 8h récente</text>

<rect x="160" y="290" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="250" y="312" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C" text-anchor="middle">Entrepôt Marseille</text>
<text x="250" y="332" font-family="sans-serif" font-size="11" fill="#085041" text-anchor="middle">Coupures fréquentes &lt;5min</text>

<rect x="340" y="290" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="430" y="312" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C" text-anchor="middle">Entrepôt Rennes</text>
<text x="430" y="332" font-family="sans-serif" font-size="11" fill="#085041" text-anchor="middle">Lenteurs fin de journée</text>

<rect x="470" y="220" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="560" y="242" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C" text-anchor="middle">Entrepôt Strasbourg</text>
<text x="560" y="262" font-family="sans-serif" font-size="11" fill="#085041" text-anchor="middle">RAS (mais non redondé)</text>
</svg>
